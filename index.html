
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON MUSIC PRO</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

:root {
  --bg:#090910;
  --panel:#13131f;
  --purple:#a855f7;
  --pink:#ec4899;
  --text:#fff;
  --muted:#9999ae;
}

* {margin:0;padding:0;box-sizing:border-box}

body {
  background:var(--bg);
  color:var(--text);
  font-family:'Be Vietnam Pro',sans-serif;
  padding-bottom:110px;
}

button,input {font-family:inherit}
button {cursor:pointer;border:0;color:white}

.sidebar {
  position:fixed;
  left:0;top:0;
  width:245px;height:100vh;
  background:#101019;
  padding:30px 20px;
  border-right:1px solid #29293b;
  z-index:5;
}

.logo {
  font-size:24px;
  font-weight:800;
  margin-bottom:45px;
  background:linear-gradient(90deg,#a855f7,#ec4899);
  color:transparent;
  background-clip:text;
}

.menu-title {
  font-size:11px;
  color:var(--muted);
  margin:25px 0 12px;
  letter-spacing:2px;
}

.menu-item {
  padding:14px;
  border-radius:12px;
  margin-bottom:7px;
  color:#aaaabd;
  cursor:pointer;
}

.menu-item:hover,.menu-item.active {
  background:#292039;
  color:#d8b4fe;
}

.menu-item span:first-child {margin-right:12px}

.main {
  margin-left:245px;
  width:calc(100% - 245px);
  padding:30px 40px;
}

.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:35px;
}

.search {
  background:#191925;
  border:1px solid #303044;
  border-radius:30px;
  padding:14px 20px;
  width:420px;
  color:white;
  outline:none;
}

.search:focus {border-color:var(--purple)}

.profile {
  background:#291b3a;
  padding:12px 20px;
  border-radius:30px;
  color:#d8b4fe;
  font-size:12px;
}

.hero {
  min-height:270px;
  border-radius:22px;
  padding:40px;
  background:
    radial-gradient(circle at 85% 30%,#a855f7,transparent 40%),
    linear-gradient(110deg,#190d2b,#39134d,#10101c);
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  margin-bottom:40px;
}

.hero:after {
  content:"♫";
  position:absolute;
  right:50px;
  top:-85px;
  font-size:350px;
  color:#ffffff12;
}

.hero-content {z-index:1}

.hero small {
  color:#d8b4fe;
  letter-spacing:4px;
  font-weight:700;
}

.hero h1 {
  font-size:clamp(28px,4vw,48px);
  margin:17px 0;
}

.hero p {color:#d4c4e5;font-size:13px}

.hero button {
  background:white;
  color:#7e22ce;
  padding:14px 28px;
  border-radius:30px;
  font-weight:700;
  margin-top:25px;
}

.section {margin-bottom:40px}

.section-header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.section-header h2 {font-size:21px}

.cards {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:20px;
}

.card {
  background:var(--panel);
  border-radius:17px;
  padding:13px;
  cursor:pointer;
  transition:.3s;
  min-width:0;
}

.card:hover {
  background:#242037;
  transform:translateY(-5px);
}

.cover {
  width:100%;
  aspect-ratio:1;
  border-radius:12px;
  object-fit:cover;
  background:linear-gradient(135deg,#48216c,#df4b99);
}

.card h3 {
  font-size:13px;
  margin:12px 0 5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.card p {color:var(--muted);font-size:11px}

.card-actions {
  display:flex;
  gap:6px;
  margin-top:12px;
}

.card-actions button {
  background:#342047;
  color:#e9d5ff;
  padding:8px;
  border-radius:8px;
  font-size:11px;
}

.song-list {
  background:var(--panel);
  border-radius:16px;
  padding:10px 18px;
}

.song {
  display:grid;
  grid-template-columns:25px minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  padding:13px 5px;
  border-bottom:1px solid #29293b;
}

.song:last-child {border:0}

.song-info {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  cursor:pointer;
}

.song-info img {
  width:45px;height:45px;
  object-fit:cover;
  border-radius:8px;
}

.song-name {
  font-size:13px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.song-artist {
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.song-actions {
  display:flex;
  gap:7px;
  align-items:center;
}

.action-btn {
  background:#292039;
  color:#d8b4fe;
  padding:8px 10px;
  border-radius:8px;
  font-size:12px;
}

.action-btn.delete {color:#fb7185}

.heart {
  background:none;
  color:#777;
  font-size:20px;
}

.heart.liked {color:var(--pink)}

.video-box {
  display:none;
  background:var(--panel);
  border-radius:15px;
  padding:15px;
  margin-bottom:30px;
}

.video-box.show {display:block}

.video-box video {
  width:100%;
  max-height:360px;
  border-radius:10px;
  background:black;
}

.empty {
  text-align:center;
  color:#999;
  padding:25px;
}

.player {
  position:fixed;
  bottom:0;left:0;right:0;
  z-index:10;
  height:100px;
  background:rgba(17,17,28,.97);
  backdrop-filter:blur(20px);
  border-top:1px solid #303044;
  display:grid;
  grid-template-columns:1fr 1.5fr 1fr;
  align-items:center;
  padding:12px 28px;
  gap:20px;
}

.now-playing {
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.now-playing img {
  width:57px;height:57px;
  border-radius:9px;
  object-fit:cover;
}

.now-playing h4 {
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.now-playing p {
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

.player-center {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.controls {
  display:flex;
  align-items:center;
  gap:23px;
}

.controls button {
  background:none;
  color:#aaa;
  font-size:19px;
}

.controls button.active {color:#c084fc}

.controls .play-btn {
  width:39px;height:39px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:white;
}

.progress-area {
  width:100%;
  max-width:450px;
  display:flex;
  align-items:center;
  gap:10px;
}

.progress-area span {
  font-size:10px;
  color:#aaa;
  min-width:30px;
}

#progress {width:100%}

input[type=range] {accent-color:#b65af6;cursor:pointer}

.player-right {
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:12px;
}

#volume {width:90px}

@media(max-width:850px) {
  .sidebar {width:65px;padding:20px 8px}
  .logo {
    font-size:12px;
    writing-mode:vertical-rl;
    margin:10px auto 35px;
  }
  .menu-item {text-align:center;padding:12px 5px}
  .menu-item span:first-child {margin:0}
  .menu-text,.menu-title {display:none}
  .main {
    margin-left:65px;
    width:calc(100% - 65px);
    padding:20px 15px;
  }
  .player {grid-template-columns:1fr 1fr;padding:10px}
  .player-right {display:none}
  .controls {gap:13px}
}

@media(max-width:480px) {
  .cards {grid-template-columns:repeat(2,1fr)}
  .player {height:85px;gap:5px}
  .now-playing img {width:42px;height:42px}
  .controls {gap:9px}
  .controls button {font-size:15px}
  .controls .play-btn {width:34px;height:34px}
  .hero {padding:25px}
  .topbar {flex-wrap:wrap}
  .search {width:100%}
  .profile {display:none}
  .song-actions .action-btn {padding:7px;font-size:10px}
  .song-actions {gap:4px}
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">♫ NEON MUSIC</div>

  <div class="menu-title">MENU</div>

  <div class="menu-item active" onclick="showPage('home',this)">
    <span>⌂</span><span class="menu-text">Trang chủ</span>
  </div>

  <div class="menu-item" onclick="showPage('search',this)">
    <span>⌕</span><span class="menu-text">Tìm kiếm</span>
  </div>

  <div class="menu-item" onclick="showPage('favorites',this)">
    <span>♥</span><span class="menu-text">Yêu thích</span>
  </div>

  <div class="menu-title">THƯ VIỆN</div>

  <div class="menu-item" onclick="document.getElementById('fileInput').click()">
    <span>＋</span><span class="menu-text">Thêm nhạc</span>
  </div>

  <div class="menu-item" onclick="showPage('playlist',this)">
    <span>▤</span><span class="menu-text">Playlist</span>
  </div>
</div>

<main class="main">

  <header class="topbar">
    <input class="search" id="searchInput"
      placeholder="⌕ Tìm kiếm bài hát..."
      oninput="searchSongs()">
    <div class="profile">♫ MUSIC LOVER</div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <small>WELCOME TO NEON MUSIC</small>
      <h1>Âm nhạc kết nối cảm xúc</h1>
      <p>Khám phá thế giới âm nhạc theo cách của bạn.</p>
      <button onclick="document.getElementById('fileInput').click()">
        + Thêm nhạc ngay
      </button>
    </div>
  </section>

  <section class="video-box" id="videoBox">
    <h3 style="margin-bottom:12px">🎬 Video đang phát</h3>
    <video id="videoPlayer" controls playsinline></video>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 id="sectionTitle">♫ Bài hát của bạn</h2>
      <button class="action-btn"
        onclick="document.getElementById('fileInput').click()">
        + Tải nhạc
      </button>
    </div>

    <div class="cards" id="musicCards"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>☰ Danh sách bài hát</h2>
    </div>
    <div class="song-list" id="songList"></div>
  </section>

  <input type="file" id="fileInput"
    accept=".mp3,.wav,.ogg,.m4a,.aac,.mp4,audio/*,video/mp4"
    multiple hidden>

</main>

<footer class="player">

  <div class="now-playing">
    <img id="currentCover"
      src="https://placehold.co/100x100/25183c/ffffff?text=MUSIC">

    <div style="min-width:0">
      <h4 id="currentTitle">Chưa phát nhạc</h4>
      <p id="currentArtist">NEON MUSIC</p>
    </div>

    <button class="heart" id="currentHeart"
      onclick="toggleFavorite(currentIndex)">♡</button>
  </div>

  <div class="player-center">
    <div class="controls">
      <button id="shuffleBtn" onclick="toggleShuffle()">⤨</button>
      <button onclick="previousSong()">⏮</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextSong()">⏭</button>
      <button id="repeatBtn" onclick="toggleRepeat()">↻</button>
    </div>

    <div class="progress-area">
      <span id="currentTime">0:00</span>
      <input type="range" id="progress" min="0" max="100" value="0">
      <span id="duration">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <span>🔊</span>
    <input type="range" id="volume"
      min="0" max="1" step="0.01" value="0.7">
  </div>

</footer>

<script>

// DATA

const DB_KEY = "neonMusicSongs";
const FAV_KEY = "neonMusicFavorites";

let songs = [];
let currentIndex = -1;
let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
let shuffle = false;
let repeat = false;
let currentPage = "home";

const audio = new Audio();
audio.volume = 0.7;

const video = document.getElementById("videoPlayer");

// DATABASE: INDEXEDDB

let db;

const dbRequest = indexedDB.open("NeonMusicDB",1);

dbRequest.onupgradeneeded = function(e) {
  const database = e.target.result;

  if (!database.objectStoreNames.contains("songs")) {
    database.createObjectStore("songs",{keyPath:"id"});
  }
};

dbRequest.onsuccess = async function(e) {
  db = e.target.result;
  await loadSavedSongs();
};

dbRequest.onerror = function() {
  alert("Không thể mở bộ nhớ nhạc trên trình duyệt.");
};

function saveSong(song) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction("songs","readwrite");
    tx.objectStore("songs").put({
      id:song.id,
      name:song.name,
      artist:song.artist,
      cover:song.cover,
      blob:song.blob,
      type:song.type,
      duration:song.duration
    });

    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}

function loadSavedSongs() {
  return new Promise((resolve,reject) => {
    const tx = db.transaction("songs","readonly");
    const request = tx.objectStore("songs").getAll();

    request.onsuccess = async () => {
      songs = request.result.map(s => ({
        ...s,
        url:URL.createObjectURL(s.blob)
      }));

      renderSongs();
      resolve();
    };

    request.onerror = reject;
  });
}

// HELPERS

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  return Math.floor(seconds/60) + ":" +
    String(Math.floor(seconds%60)).padStart(2,"0");
}

function isVideo(song) {
  return song.type.startsWith("video/") ||
    song.name.toLowerCase().endsWith(".mp4");
}

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g,c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

// UPLOAD

document.getElementById("fileInput").addEventListener("change",async function(e) {
  const files = Array.from(e.target.files);

  for (const file of files) {
    const id = crypto.randomUUID();

    const song = {
      id,
      name:file.name.replace(/\.[^/.]+$/,""),
      artist:"Từ thiết bị của bạn",
      url:URL.createObjectURL(file),
      blob:file,
      type:file.type,
      cover:"https://placehold.co/300x300/44205e/ffffff?text=MUSIC",
      duration:"Đang tải..."
    };

    songs.push(song);

    const temp = document.createElement(isVideo(song) ? "video" : "audio");
    temp.preload = "metadata";
    temp.src = song.url;

    await new Promise(resolve => {
      temp.onloadedmetadata = resolve;
      temp.onerror = resolve;
    });

    song.duration = formatTime(temp.duration);

    temp.removeAttribute("src");
    temp.load();

    await saveSong(song);
  }

  renderSongs();
  e.target.value = "";
});

// RENDER

function renderSongs(list = songs) {
  const cards = document.getElementById("musicCards");
  const songList = document.getElementById("songList");

  cards.innerHTML = "";
  songList.innerHTML = "";

  if (!list.length) {
    cards.innerHTML = '<div class="empty">Chưa có bài hát nào.</div>';
    songList.innerHTML = '<div class="empty">Danh sách trống.</div>';
    return;
  }

  list.forEach(song => {
    const index = songs.indexOf(song);
    const liked = favorites.includes(song.id);

    cards.innerHTML += `
      <div class="card">
        <img class="cover" src="${song.cover}">
        <h3>${escapeHTML(song.name)}</h3>
        <p>${escapeHTML(song.artist)}</p>
        <div class="card-actions">
          <button onclick="playSong(${index})">▶ Phát</button>
          <button onclick="renameSong(${index})">✎ Đổi tên</button>
        </div>
      </div>
    `;

    songList.innerHTML += `
      <div class="song">
        <span style="color:#999">${index+1}</span>

        <div class="song-info" onclick="playSong(${index})">
          <img src="${song.cover}">
          <div style="min-width:0">
            <div class="song-name">${escapeHTML(song.name)}</div>
            <div class="song-artist">${escapeHTML(song.artist)}</div>
          </div>
        </div>

        <div class="song-actions">
          <span style="font-size:11px;color:#999">${song.duration}</span>
          <button class="action-btn" onclick="renameSong(${index})">✎</button>
          <button class="heart ${liked?'liked':''}"
            onclick="toggleFavorite(${index})">${liked?'♥':'♡'}</button>
          <button class="action-btn delete"
            onclick="deleteSong(${index})">✕</button>
        </div>
      </div>
    `;
  });
}

// RENAME SONG

async function renameSong(index) {
  const song = songs[index];
  if (!song) return;

  const newName = prompt("Nhập tên bài hát mới:",song.name);

  if (newName === null) return;

  if (!newName.trim()) {
    alert("Tên bài hát không được để trống!");
    return;
  }

  song.name = newName.trim();

  if (currentIndex === index) {
    document.getElementById("currentTitle").textContent = song.name;
  }

  await saveSong(song);
  renderSongs();
}

// DELETE SONG

async function deleteSong(index) {
  const song = songs[index];
  if (!song) return;

  if (!confirm("Bạn có chắc muốn xóa bài hát này khỏi thư viện?")) return;

  if (currentIndex === index) {
    audio.pause();
    video.pause();
    audio.removeAttribute("src");
    video.removeAttribute("src");
    currentIndex = -1;

    document.getElementById("currentTitle").textContent = "Chưa phát nhạc";
    document.getElementById("currentArtist").textContent = "NEON MUSIC";
    document.getElementById("playBtn").textContent = "▶";
    document.getElementById("videoBox").classList.remove("show");
  } else if (currentIndex > index) {
    currentIndex--;
  }

  URL.revokeObjectURL(song.url);

  songs.splice(index,1);
  favorites = favorites.filter(id => songs.some(s => s.id === id));

  localStorage.setItem(FAV_KEY,JSON.stringify(favorites));

  const tx = db.transaction("songs","readwrite");
  tx.objectStore("songs").delete(song.id);

  tx.oncomplete = () => {
    renderSongs();
    updateHeart();
  };
}

// PLAY SONG

function playSong(index) {
  if (index < 0 || index >= songs.length) return;

  currentIndex = index;

  const song = songs[index];

  audio.pause();
  video.pause();

  audio.removeAttribute("src");
  video.removeAttribute("src");

  const videoBox = document.getElementById("videoBox");

  if (isVideo(song)) {
    videoBox.classList.add("show");
    video.src = song.url;
    video.load();
    video.play().catch(() => {});
  } else {
    videoBox.classList.remove("show");
    audio.src = song.url;
    audio.load();
    audio.play().catch(() => {});
  }

  document.getElementById("currentTitle").textContent = song.name;
  document.getElementById("currentArtist").textContent = song.artist;
  document.getElementById("currentCover").src = song.cover;

  updateHeart();
  updatePlayButton();
}

function activeMedia() {
  if (currentIndex < 0) return audio;
  return isVideo(songs[currentIndex]) ? video : audio;
}

// PLAY / PAUSE

function togglePlay() {
  if (currentIndex === -1) {
    if (songs.length) playSong(0);
    else alert("Hãy thêm nhạc trước!");
    return;
  }

  const media = activeMedia();

  if (media.paused) media.play().catch(() => {});
  else media.pause();

  updatePlayButton();
}

function updatePlayButton() {
  const media = currentIndex < 0 ? null : activeMedia();

  document.getElementById("playBtn").textContent =
    media && !media.paused ? "Ⅱ" : "▶";
}

// NEXT / PREVIOUS

function nextSong() {
  if (!songs.length) return;

  let next;

  if (shuffle && songs.length > 1) {
    do {
      next = Math.floor(Math.random()*songs.length);
    } while (next === currentIndex);
  } else {
    next = (currentIndex+1)%songs.length;
  }

  playSong(next);
}

function previousSong() {
  if (!songs.length) return;

  const media = activeMedia();

  if (media.currentTime > 3) {
    media.currentTime = 0;
    return;
  }

  playSong((currentIndex-1+songs.length)%songs.length);
}

// SHUFFLE / REPEAT

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById("shuffleBtn").classList.toggle("active",shuffle);
}

function toggleRepeat() {
  repeat = !repeat;
  document.getElementById("repeatBtn").classList.toggle("active",repeat);
}

// PROGRESS

function updateProgress() {
  if (currentIndex < 0) return;

  const media = activeMedia();

  if (!Number.isFinite(media.duration)) return;

  document.getElementById("progress").value =
    media.currentTime/media.duration*100;

  document.getElementById("currentTime").textContent =
    formatTime(media.currentTime);

  document.getElementById("duration").textContent =
    formatTime(media.duration);
}

[audio,video].forEach(media => {
  media.addEventListener("timeupdate",updateProgress);
  media.addEventListener("play",updatePlayButton);
  media.addEventListener("pause",updatePlayButton);

  media.addEventListener("ended",() => {
    if (repeat) {
      media.currentTime = 0;
      media.play().catch(() => {});
    } else {
      nextSong();
    }
  });
});

document.getElementById("progress").addEventListener("input",function() {
  if (currentIndex < 0) return;

  const media = activeMedia();

  if (Number.isFinite(media.duration)) {
    media.currentTime = this.value/100*media.duration;
  }
});

// VOLUME

document.getElementById("volume").addEventListener("input",function() {
  audio.volume = this.value;
  video.volume = this.value;
});

// FAVORITES

function toggleFavorite(index) {
  const song = songs[index];
  if (!song) return;

  if (favorites.includes(song.id)) {
    favorites = favorites.filter(id => id !== song.id);
  } else {
    favorites.push(song.id);
  }

  localStorage.setItem(FAV_KEY,JSON.stringify(favorites));

  updateHeart();
  renderSongs();

  if (currentPage === "favorites") showPage("favorites");
}

function updateHeart() {
  const heart = document.getElementById("currentHeart");
  const liked = currentIndex >= 0 &&
    favorites.includes(songs[currentIndex].id);

  heart.textContent = liked ? "♥" : "♡";
  heart.classList.toggle("liked",liked);
}

// SEARCH

function searchSongs() {
  const keyword = document.getElementById("searchInput")
    .value.toLowerCase().trim();

  document.getElementById("sectionTitle").textContent =
    "⌕ Kết quả tìm kiếm";

  renderSongs(songs.filter(song =>
    song.name.toLowerCase().includes(keyword) ||
    song.artist.toLowerCase().includes(keyword)
  ));
}

// NAVIGATION

function showPage(page,element) {
  currentPage = page;

  document.querySelectorAll(".menu-item")
    .forEach(item => item.classList.remove("active"));

  if (element) element.classList.add("active");

  document.getElementById("searchInput").value = "";

  const title = document.getElementById("sectionTitle");

  if (page === "favorites") {
    title.textContent = "♥ Bài hát yêu thích";
    renderSongs(songs.filter(s => favorites.includes(s.id)));
  } else if (page === "playlist") {
    title.textContent = "▤ Thư viện nhạc";
    renderSongs();
  } else if (page === "search") {
    title.textContent = "⌕ Tìm kiếm";
    document.getElementById("searchInput").focus();
    renderSongs();
  } else {
    title.textContent = "♫ Bài hát của bạn";
    renderSongs();
  }
}

</script>
